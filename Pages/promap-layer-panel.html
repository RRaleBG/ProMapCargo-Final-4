<!-- Add inside .navigation-map-shell, above #navMap -->
<div id="promapLayerPanel" class="promap-layer-panel" aria-label="Map layers">
    <div class="promap-layer-title">MAP LAYERS</div>

    <label><input type="checkbox" data-promap-layer="route" checked> Ruta</label>
    <label><input type="checkbox" data-promap-layer="restrictions" checked> Truck restrikcije</label>
    <label><input type="checkbox" data-promap-layer="fleet"> Flota</label>
    <label><input type="checkbox" data-promap-layer="poi"> Truck POI</label>
    <label><input type="checkbox" data-promap-layer="traffic"> Traffic</label>
    <label><input type="checkbox" data-promap-layer="incidents"> Incidents</label>
    <label><input type="checkbox" data-promap-layer="weather"> Weather</label>
    <label><input type="checkbox" data-promap-layer="elevation"> Elevation</label>
</div>

<style>
.promap-layer-panel {
    position: absolute;
    top: 74px;
    left: 12px;
    z-index: 1200;
    width: 190px;
    padding: 11px;
    border: 1px solid rgba(148,163,184,.18);
    border-radius: 14px;
    background: rgba(4,18,15,.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 14px 35px rgba(0,0,0,.32);
    color: #dff8ee;
    font: 600 11px/1.4 Inter,system-ui,sans-serif;
}
.promap-layer-title {
    margin-bottom: 8px;
    color: #5eead4;
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .12em;
}
.promap-layer-panel label {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 4px 0;
    cursor: pointer;
}
.promap-layer-panel input {
    accent-color: #10b981;
}
</style>

<script>
(() => {
    const panel = document.getElementById("promapLayerPanel");
    if (!panel || panel.dataset.bound === "1") return;
    panel.dataset.bound = "1";

    panel.querySelectorAll("input[data-promap-layer]").forEach(input => {
        input.addEventListener("change", () => {
            const group = input.dataset.promapLayer;
            window.ProMap.MapEnhancementState?.setGroupVisible?.(
                group,
                input.checked
            );
        });
    });
})();
</script>
