services:
  osrm:
    image: osrm/osrm-backend:latest
    container_name: promap-osrm
    restart: unless-stopped
    entrypoint:
      [
        "/bin/sh",
        "/scripts/start-osrm.sh"
      ]
    environment:
      OSRM_DATASET: serbia-latest
      OSRM_ALGORITHM: mld
      OSRM_PORT: 5090
    ports:
      - "5001:5090"
    volumes:
      - ./osm:/data:ro
      - ./scripts/start-osrm.sh:/scripts/start-osrm.sh:ro
    networks:
      - promaptruc-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promap-api
    restart: unless-stopped
    volumes:
      - ./wwwroot/styles:/app/wwwroot/styles:ro
      - ./wwwroot/maps:/app/wwwroot/maps:ro
      - ./wwwroot/fonts:/app/wwwroot/fonts:ro
      - ./wwwroot/lib:/app/wwwroot/lib:ro
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=promaptruc-postgres;Port=5432;Database=mapprotruc;Username=mapprotruc;Password=change-me-local-only
      PROMAP_POSTGRES: Host=promaptruc-postgres;Port=5432;Database=mapprotruc;Username=mapprotruc;Password=change-me-local-only
      Routing__OsrmBaseUrl: http://promaptruc-osrm:5000
      Routing__OsrmFallbackBaseUrl: https://router.project-osrm.org
      Cors__Origins__0: http://localhost:8080
      Cors__Origins__1: http://localhost:8090
      MobileAuth__Issuer: ProMapCargo
      MobileAuth__Audience: ProMapCargo.Mobile
      MobileAuth__SigningKey: promapcargo-mobile-change-this-signing-key-2026
    ports:
      - "8080:8080"
    depends_on:
      osrm:
        condition: service_started
    networks:
      - promaptruc-network

networks:
  promaptruc-network:
    external: true
