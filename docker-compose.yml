version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: promap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: promapcargo
      POSTGRES_USER: promap
      POSTGRES_PASSWORD: promap_dev_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Planner/memory tuning for the routing graph (road_edges is large).
    # random_page_cost=1.1 lets the planner use the GiST index on SSD storage
    # instead of a full parallel sequential scan; jit=off avoids ~1 s of JIT
    # compilation per short query.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c random_page_cost=1.1
      -c jit=off
      -c max_parallel_workers_per_gather=2
    shm_size: "1g"
    mem_limit: "2g"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promap -d promapcargo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - promap-network

  osrm:
    image: osrm/osrm-backend:latest
    container_name: promap-osrm
    restart: unless-stopped
    command: ["osrm-routed", "--algorithm", "mld", "/data/serbia-latest.osrm"]
    ports:
      - "5001:5000"
    volumes:
      - ./osm:/data:ro
    mem_limit: "2g"
    depends_on:
      - postgres
    networks:
      - promap-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: promap-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=promapcargo;Username=promap;Password=promap_dev_change_me
      PROMAP_POSTGRES: Host=postgres;Port=5432;Database=promapcargo;Username=promap;Password=promap_dev_change_me
      Routing__OsrmBaseUrl: http://osrm:5000
      Routing__OsrmFallbackBaseUrl: https://router.project-osrm.org
      Cors__Origins__0: http://localhost:8080
      Cors__Origins__1: http://localhost:3000
      Cors__Origins__2: http://localhost:5173
      MobileAuth__Issuer: ProMapCargo
      MobileAuth__Audience: ProMapCargo.Mobile
      MobileAuth__SigningKey: promapcargo-mobile-change-this-signing-key-2026
      Seed__Enabled: "true"
      DOTNET_gcServer: "1"
      DOTNET_GCHeapHardLimitPercent: "75"
      DOTNET_ThreadPool_MinThreads: "8"
      # In-memory routing graph cache: number of 0.1 degree tiles kept in RAM.
      RoutingGraphCache__MaxTiles: "120"
    ports:
      - "8080:8080"
    volumes:
      - ./wwwroot/styles:/app/wwwroot/styles:ro
      - ./wwwroot/maps:/app/wwwroot/maps:ro
      - ./wwwroot/fonts:/app/wwwroot/fonts:ro
      - ./wwwroot/lib:/app/wwwroot/lib:ro
      - dataprotection_keys:/root/.aspnet/DataProtection-Keys
    # Raised from 1g: the routing graph cache keeps several hundred MB of
    # edges in memory (GC heap hard limit is 75% of this value).
    mem_limit: "2g"
    depends_on:
      postgres:
        condition: service_healthy
      osrm:
        condition: service_started
    networks:
      - promap-network

networks:
  promap-network:
    driver: bridge

volumes:
  postgres_data:
  dataprotection_keys:
