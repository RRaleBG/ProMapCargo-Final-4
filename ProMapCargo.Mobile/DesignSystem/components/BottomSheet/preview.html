<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:var(--SurfaceBase)}</style></head>
<body><div class="pm-screen"><div class="pm-map" style="padding:16px;border-radius:20px;height:388px;display:flex;align-items:flex-end">
<div class="PmBottomPanel pm-stack" style="gap:10px;width:100%">
  <div class="pm-row" style="justify-content:space-between"><p class="PmSectionTitleLabel">Planiranje rute</p><button class="pm-btn PmMapMiniButton">Zatvori</button></div>
  <div class="pm-row" style="gap:8px"><div class="PmFieldBorder" style="flex:1"><input class="PmEntry" placeholder="Polazak (adresa ili mesto)" aria-label="Polazak"></div><button class="pm-btn PmMapMiniButton">Moja lokacija</button></div>
  <div class="pm-row" style="gap:8px"><div class="PmFieldBorder" style="flex:1"><input class="PmEntry" value="Novi Sad, Futoški put" aria-label="Odredište"></div><button class="pm-btn PmMapMiniButton" aria-label="Zameni">⇅</button></div>
  <div class="pm-stack" style="padding:8px 6px;gap:1px"><span class="PmBodyLabel">Futoški put 12</span><span class="PmCaptionLabel">Novi Sad, Srbija</span></div>
  <div class="pm-row" style="gap:8px"><label class="pm-switch"><input type="checkbox" checked aria-label="Izbegavaj ograničene puteve"><span class="track"></span><span class="thumb"></span></label><span class="PmBodyLabel">Izbegavaj ograničene puteve</span></div>
  <button class="pm-btn PmPrimaryButton is-full">Izračunaj rutu</button>
</div></div></div></body></html>
