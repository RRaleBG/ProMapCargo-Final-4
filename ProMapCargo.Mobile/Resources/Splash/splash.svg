<?xml version="1.0" encoding="UTF-8"?>
<!--
  ProMap Cargo splash: the web UI's brand mark (rounded emerald tile, outlined diamond,
  glowing teal point) on the app background (#031712, set in the .csproj).
  Android 12+ shows the splash icon inside a circle of about 2/3 of the canvas, so the
  mark stays within the central 300 px. No filters: glows are radial gradients, which
  the build-time SVG renderer draws reliably.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.20"/>
    </linearGradient>
    <radialGradient id="shine" cx="34%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EE7B7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="point" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCFBF1"/>
      <stop offset="45%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- soft glow behind the mark -->
  <circle cx="228" cy="228" r="170" fill="url(#halo)"/>

  <!-- tile -->
  <rect x="128" y="128" width="200" height="200" rx="58" fill="#062A22"/>
  <rect x="128" y="128" width="200" height="200" rx="58" fill="url(#tile)"/>
  <rect x="128" y="128" width="200" height="200" rx="58" fill="url(#shine)"/>
  <rect x="129.5" y="129.5" width="197" height="197" rx="56.5" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <!-- diamond (route waypoint) -->
  <rect x="190" y="190" width="76" height="76" rx="22" fill="none" stroke="#6EE7B7" stroke-width="9"
        transform="rotate(45 228 228)"/>

  <!-- glowing point -->
  <circle cx="228" cy="228" r="30" fill="url(#point)" opacity="0.75"/>
  <circle cx="228" cy="228" r="10" fill="#2DD4BF"/>
  <circle cx="228" cy="228" r="4" fill="#ECFDF5"/>
</svg>
