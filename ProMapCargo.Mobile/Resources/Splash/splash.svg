<?xml version="1.0" encoding="UTF-8"?>
<!--
  System splash: intentionally empty. Android 12+ always shows a system splash before
  the app draws; with a transparent icon it is only the app background (#031712, set in
  the .csproj), so the one visible start-up screen is MainPage (truck on the route and
  the 0-100 % bar). A mark here looked like a second, different splash screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <rect width="456" height="456" fill="#031712" fill-opacity="0"/>
</svg>
