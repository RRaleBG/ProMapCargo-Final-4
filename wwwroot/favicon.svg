<?xml version="1.0" encoding="UTF-8"?>
<!--
  ProMap Cargo app icon, the same mark as the web (favicon.svg) and the truck on the
  start screen: emerald tile with the dark truck glyph from the home page animation,
  on the route between two points. Content stays inside the central safe zone, so the
  platform masks (circle, squircle) do not cut it. No filters: glows are gradients.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A2A23"/>
      <stop offset="55%" stop-color="#031712"/>
      <stop offset="100%" stop-color="#010C0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="55%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE9F"/>
      <stop offset="100%" stop-color="#22C08A"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background: the OS applies its own corner mask -->
  <rect width="456" height="456" fill="url(#bg)"/>

  <!-- route: Beograd (bottom left) to Novi Sad (top right), as on the web home page -->
  <path d="M84 344 C130 334 140 308 176 300 C214 292 226 252 252 238 C282 222 292 182 322 160 C342 146 356 124 376 104"
        fill="none" stroke="#10B981" stroke-opacity="0.16" stroke-width="22" stroke-linecap="round"/>
  <path d="M84 344 C130 334 140 308 176 300 C214 292 226 252 252 238 C282 222 292 182 322 160 C342 146 356 124 376 104"
        fill="none" stroke="url(#route)" stroke-width="9" stroke-linecap="round" stroke-dasharray="20 18"/>
  <circle cx="84" cy="344" r="17" fill="#031712" stroke="#2DD4BF" stroke-width="7"/>
  <circle cx="376" cy="104" r="17" fill="#031712" stroke="#22D3EE" stroke-width="7"/>

  <!-- glow and pulse ring around the truck tile -->
  <circle cx="228" cy="228" r="168" fill="url(#glow)"/>
  <rect x="112" y="112" width="232" height="232" rx="68" fill="none" stroke="#34D399" stroke-opacity="0.28" stroke-width="4"/>

  <!-- truck tile -->
  <rect x="134" y="134" width="188" height="188" rx="54" fill="url(#tile)"/>
  <rect x="135.5" y="135.5" width="185" height="185" rx="52.5" fill="none" stroke="#A7F3D0" stroke-opacity="0.55" stroke-width="3"/>

  <!-- truck glyph (Lucide-style, as on the web home page) -->
  <g transform="translate(144 137) scale(7)" fill="none" stroke="#021512" stroke-width="1.9"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h11v10H3z"/>
    <path d="M14 10h4l3 3v3h-7"/>
    <circle cx="7" cy="18" r="2" fill="url(#tile)"/>
    <circle cx="18" cy="18" r="2" fill="url(#tile)"/>
  </g>
</svg>
